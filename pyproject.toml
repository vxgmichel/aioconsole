[build-system]
requires = ["setuptools >= 77"]
build-backend = "setuptools.build_meta"

[project]
name = "aioconsole"
dynamic = ["version"]
description = "Asynchronous console and interfaces for asyncio"
readme = {file = "README.rst", content-type = "text/x-rst"}
license = "GPL-3.0-or-later"
requires-python = ">=3.10.3"
authors = [
    { name = "Vincent Michel", email = "vxgmichel@gmail.com" },
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/vxgmichel/aioconsole"

[project.scripts]
apython = "aioconsole:run_apython"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-repeat",
    'uvloop; python_implementation != "PyPy" and sys_platform != "win32"',
]

[tool.setuptools]
packages = ["aioconsole"]

[tool.setuptools.dynamic]
version = {attr = "aioconsole.__version__"}

[tool.pytest.ini_options]
addopts = "--strict-markers --cov aioconsole --strict-markers --count 2 -vv"
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.coverage.run]
# Measure `python -m aioconsole` subprocesses spawned by apython tests
patch = ["subprocess"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "assert False"]

[tool.ruff.lint]
ignore = [
    "E501",
    "F403",
    "ASYNC",
    "B",
    "BLE",
    "RUF",
    "S",
    "SIM117",
    "TRY",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM115"]
